[package]
name = "gametracker"
version = "0.1.0"
description = "Tracks how long you play your PC games"
authors = ["Naseeh"]
edition = "2021"

[lib]
name = "gametracker_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset", "tray-icon"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.31.0", features = ["bundled", "chrono"] }
chrono = { version = "0.4", features = ["serde"] }
sysinfo = "0.39.6"
walkdir = "2.5.0"
tauri-plugin-dialog = "2.7.3"
keyring = "4.2.0"
tauri-plugin-deep-link = "2.4.10"
tauri-plugin-single-instance = { version = "2.4.5", features = ["deep-link"] }
tauri-plugin-autostart = "2"
tauri-plugin-log = "2.10.1"
tauri-plugin-updater = "2.14.0"
log = "0.4.34"
reqwest = { version = "0.13", default-features = false, features = ["blocking", "json", "native-tls"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true


[dev-dependencies]
tempfile = "3.27.0"

